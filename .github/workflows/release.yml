name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Keeps a release PR open with the next version and CHANGELOG.md.
      # PRs opened with GITHUB_TOKEN don't trigger CI, so required checks would never
      # run on the release PR. Set the RELEASE_PLEASE_TOKEN secret (a fine-grained PAT
      # with contents + pull-requests write on this repo) so they do.
      # The release is created as a draft (release-please-config.json `draft`) and
      # published by the assets job once the wheel is uploaded, so `releases/latest`
      # never points at a release the installers can't download from.
      # `force-tag-creation` pushes the tag now: GitHub tags a draft only on publish,
      # and release-please finds the previous release by its tag.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # The wheel bundles the exported UI and the catalog, so `athena serve` serves them.
      # The install scripts download athena_server-<version>-py3-none-any.whl.
      # The script also checks the wheel contains both.
      - name: Build the server wheel
        run: bash scripts/build-wheel.sh

      # The installers download SHA256SUMS and verify the wheel against it before
      # installing. It lists the exact files uploaded below, by bare file name.
      - name: Generate SHA256SUMS
        run: |
          mkdir release-assets
          cp dist/*.whl scripts/install.sh scripts/install.ps1 release-assets/
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber

      # Only now does the release become public and `releases/latest`. If a step above
      # fails, it stays a draft: fix it and re-run this job.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
