name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. Pushes to main and the merge queue always
  # run everything. The diff is the PR merge commit against its first parent (the base).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
      web: ${{ steps.diff.outputs.web }}
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Which parts changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf '%s\n' install=true web=true server=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          # Each job also reruns when this workflow changes.
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          {
            echo "install=$(match '^(scripts/install\.(sh|ps1)|\.github/workflows/ci\.yml)$')"
            echo "web=$(match '^(apps/web/|apps/server/|packages/|package\.json|pnpm-|\.github/workflows/ci\.yml)')"
            echo "server=$(match '^(apps/server/|catalog/|\.github/workflows/ci\.yml)')"
          } >> "$GITHUB_OUTPUT"

  repo:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Generated agent config is in sync (scripts/agents-sync.mjs)
        run: node scripts/agents-sync.mjs --check

      - name: Agent setup script parses and runs (scripts/agents-setup.mjs)
        run: node scripts/agents-setup.mjs --check --quiet

      - name: Agent guard rules (scripts/agent-guard.mjs)
        run: node scripts/agent-guard.mjs --self-test

      - name: Agent docs point at real files and names
        run: node scripts/check-docs.mjs

      - name: No secrets in the tree (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner

      - name: Claude skills link points at the shared skills
        run: test "$(readlink .claude/skills)" = "../.agents/skills"

      - name: Lint workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

  install-scripts:
    name: install script (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test Linux only; main and the merge queue run every OS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dry run (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh --dry-run --version 0.0.0
          bash scripts/install.sh --dry-run --uninstall --purge

      - name: Lint (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -DryRun -Version 0.0.0
          ./scripts/install.ps1 -DryRun -Uninstall -Purge

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API client is up to date with the server
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm gen:api' and commit the result."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static export)
        run: pnpm build

  server:
    name: server (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test Linux only; main and the merge queue run every OS, so a
        # macOS or Windows failure shows up after the merge (see gotchas/windows.md).
        # ubuntu-24.04-arm: Linux arm64 (Raspberry Pi and other ARM boards).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
    env:
      # Ubuntu runners ship Docker Engine: run the real container lifecycle test there.
      ATHENA_DOCKER_TESTS: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # tests/test_cloud.py drives a real rclone where one is installed. Ubuntu gets the
      # distro's older rclone on purpose: it's what Ubuntu LTS users will have.
      - name: Install rclone
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq rclone ;;
            macOS) brew install rclone ;;
            Windows) choco install rclone -y --no-progress ;;
          esac
          rclone version

      # tests/test_backup.py drives a real restic where ATHENA_TEST_RESTIC points. Athena's
      # own downloader fetches it, so this also checks the pinned checksum for this OS.
      - name: Install restic
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import subprocess
          from pathlib import Path

          from athena.backup.restic import ensure_restic

          binary = asyncio.run(ensure_restic(Path(os.environ["RUNNER_TEMP"]) / "restic"))
          subprocess.run([str(binary), "version"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ATHENA_TEST_RESTIC={binary}\n")
          PY

      # tests/test_https_letsencrypt.py runs the real lego against Pebble (Let's Encrypt's
      # test server, MPL-2.0). Validation always passes: it checks the lego download,
      # its flags, the ACME flow and installing the certificate, not port 80.
      - name: Start Pebble
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run -d --name pebble -p 14000:14000 \
            -e PEBBLE_VA_ALWAYS_VALID=1 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            ghcr.io/letsencrypt/pebble:2.10.3
          curl -fsSL -o "$RUNNER_TEMP/pebble.minica.pem" \
            https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.3/test/certs/pebble.minica.pem
          for _ in $(seq 30); do curl -fsk https://localhost:14000/dir >/dev/null && break; sleep 1; done
          {
            echo "ATHENA_ACME_DIRECTORY=https://localhost:14000/dir"
            echo "ATHENA_ACME_CA_CERTIFICATES=$RUNNER_TEMP/pebble.minica.pem"
            echo "ATHENA_ACME_HTTP_ADDRESS=:5002"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Service install dry run
        run: uv run athena service install --dry-run

  # The single required status check for branch protection. Add new jobs to `needs`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, repo, install-scripts, web, server]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
