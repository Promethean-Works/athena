# Secret scanning (gitleaks, MIT): pre-commit runs it on staged changes, CI on the tree.
# Run locally: gitleaks dir . --redact
[extend]
useDefault = true

[[allowlists]]
description = "Build output, never committed: `gitleaks dir` doesn't read .gitignore, and pytest's .pyc of the secret-guard tests holds their fake tokens"
paths = [
  '''(^|/)__pycache__/''',
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
]
