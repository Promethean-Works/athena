# Generated by scripts/agents-sync.mjs from .mcp.json. Don't edit by hand.
# Codex loads this only when the project is trusted (see docs/agents/tooling.md).

[mcp_servers."shadcn"]
command = "npx"
args = ["shadcn@latest","mcp"]

[mcp_servers."next-devtools"]
command = "npx"
args = ["-y","next-devtools-mcp@latest"]

[mcp_servers."playwright"]
command = "npx"
args = ["-y","@playwright/mcp@latest","--headless","--isolated","--output-dir",".playwright-mcp","--console-level","error","--snapshot-mode","none"]

[mcp_servers."context7"]
command = "npx"
args = ["-y","@upstash/context7-mcp@latest"]

[mcp_servers."github"]
url = "https://api.githubcopilot.com/mcp/"
headers = { "Authorization" = "Bearer ${GITHUB_TOKEN}" }
