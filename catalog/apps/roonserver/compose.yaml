x-athena:
  title: RoonServer
  description: Roon music server for high-fidelity audio streaming and multi-room playback.
  tagline: High-fidelity music server.
  tags: [Music, Audio, Streaming]
  license: "Proprietary"
  category: media
  platforms: [linux/amd64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RoonServer/icon.svg
  homepage: https://roonlabs.com
  smoke: start
  smoke_note: no web UI; Roon apps on the same network find it through host networking
  notes: >-
    Roon Server has no web page: open a Roon app on a computer or phone on the same network and it finds
    the server. It uses host networking, so it needs Linux (not Docker Desktop) and an x86-64 CPU.
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RoonServer/icon.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RoonServer/screenshot-1.png
  env:
    - key: MUSIC_PATH
      label: Music folder
      type: path
      description: The folder with your music library (mounted read-only).
      default: "@app_data/music"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  roon:
    image: ghcr.io/roonlabs/roonserver:1.0.8
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/roon:/Roon
      - ${MUSIC_PATH}:/Music:ro
      - ${ATHENA_APP_DATA}/backups:/RoonBackups
