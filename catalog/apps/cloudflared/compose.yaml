x-athena:
  title: Cloudflared
  description: Cloudflare Tunnel client for securely exposing services to the internet.
  tagline: Cloudflare Tunnel client.
  tags: [Tunnel, Cloudflare, Network]
  license: "Apache-2.0"
  category: network
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Cloudflared/icon.svg
  homepage: https://developers.cloudflare.com/cloudflare-one/tunnels
  web_port: null
  smoke: skip
  smoke_note: needs a Cloudflare tunnel token
  notes: >-
    Create a tunnel in the Cloudflare Zero Trust dashboard (Networks → Tunnels), choose
    Docker, and paste the token from the shown command into the form.
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Cloudflared/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Cloudflared/screenshot-2.png
  env:
    - key: TUNNEL_TOKEN
      label: Tunnel token
      type: password
      description: From the Cloudflare Zero Trust dashboard, Networks → Tunnels.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
