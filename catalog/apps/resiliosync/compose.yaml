x-athena:
  title: Resilio Sync
  description: Peer-to-peer file synchronization between your devices.
  tagline: Peer-to-peer file sync.
  tags: [Sync, P2P, Files]
  license: "Proprietary"
  category: files
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Resilio-sync/icon.svg
  homepage: https://www.resilio.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Resilio-sync/icon.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Resilio-sync/screenshot-1.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8131"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  resilio-sync:
    image: linuxserver/resilio-sync:3.1.2
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8888/tcp"
      - "55555:55555/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/data:/data
