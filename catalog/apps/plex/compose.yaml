# Imported from the CasaOS AppStore (Apache-2.0): Apps/Plex
x-athena:
  title: Plex
  description: Stream Movies & TV Shows
  category: media
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Plex/icon.svg
  homepage: https://www.plex.tv
  web_port: 32400
  web_path: /web/index.html
  platforms: [linux/amd64, linux/arm64]
  notes: >-
    Open Plex, sign in, and add a library pointing at /Media (your media folder).
    Hardware transcoding needs a Plex Pass and the host's GPU: add `devices: ["/dev/dri:/dev/dri"]`
    to the service on a Linux host with an Intel or AMD GPU.
  env:
  - key: PGID
    label: Group ID
    default: '@gid'
    advanced: true
  - key: PUID
    label: User ID
    default: '@uid'
    advanced: true
  - key: MEDIA_PATH
    label: Media folder
    type: path
    default: '@app_data/media'
    description: The folder with your movies, shows and music, seen by Plex as /Media.
services:
  plex:
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
      VERSION: docker
    image: lscr.io/linuxserver/plex:1.43.3
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/config
      target: /config
    - type: bind
      source: ${MEDIA_PATH}
      target: /Media
    container_name: plex
