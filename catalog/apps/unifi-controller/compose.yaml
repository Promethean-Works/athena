x-athena:
  title: UniFi Controller
  description: Legacy UniFi controller for managing legacy UniFi network devices.
  tagline: Legacy UniFi network controller.
  tags: [UniFi, Network, Controller]
  license: "Proprietary"
  category: network
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Unifi-controller/icon.svg
  homepage: https://ui.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Unifi-controller/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Unifi-controller/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8149"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  unifi:
    image: linuxserver/unifi-controller:8.0.7
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8443/tcp"
      - "3478:3478/tcp"
      - "8080:8080/tcp"
      - "8843:8843/tcp"
      - "8880:8880/tcp"
      - "6789:6789/tcp"
      - "5514:5514/tcp"
      - "1900:1900/udp"
      - "10001:10001/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/data:/config
