x-athena:
  title: Virtual Machine Manager
  description: Web-based virtual machine manager for running VMs on your server.
  tagline: Web-based virtual machine manager.
  tags: [Virtualization, VM, Server]
  license: "AGPL-3.0"
  category: utilities
  platforms: [linux/amd64, linux/arm64]
  smoke: skip
  smoke_note: needs KVM and libvirt on the host
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/VirtualMachineManager/icon.svg
  homepage: https://virt-manager.org
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/VirtualMachineManager/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/VirtualMachineManager/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8152"

services:
  virtmanager:
    image: mbentley/virt-manager:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8185/tcp"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/lib/libvirt/images:/var/lib/libvirt/images
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      HOSTS: "['qemu:///system']"
