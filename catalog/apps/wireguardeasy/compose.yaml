x-athena:
  title: WireGuard Easy
  description: Web GUI for WireGuard VPN with simple configuration and client management.
  tagline: Web GUI for WireGuard VPN.
  tags: [VPN, WireGuard, Security]
  license: "GPL-3.0"
  category: network
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WireGuardEasy/icon.svg
  homepage: https://we-gitea.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WireGuardEasy/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WireGuardEasy/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8156"
    - key: WEBUI_PASSWORD
      label: Web UI password
      type: password
      generate: secret

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:13
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:51820/tcp"
      - "51821:51821/udp"
    environment:
      WG_HOST: localhost
      PASSWORD: ${WEBUI_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/data:/etc/wireguard
