x-athena:
  title: Gopeed
  description: High-speed download manager with browser extension support.
  tagline: High-speed download manager.
  tags: [Downloads, Download Manager]
  license: "AGPL-3.0"
  category: downloads
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Gopeed/icon.svg
  homepage: https://gopeed.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Gopeed/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Gopeed/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8195"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  gopeed:
    image: liwei2633/gopeed:v1.9.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:9999/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/app/storage
      - ${ATHENA_APP_DATA}/downloads:/app/Downloads
