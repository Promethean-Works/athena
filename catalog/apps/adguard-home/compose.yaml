x-athena:
  title: AdGuard Home
  description: Network-wide ad and tracker blocking DNS server.
  tagline: "Block ads and trackers for every device on your network."
  tags: [DNS, Ad blocking, Network-wide]
  license: "GPL-3.0"
  features:
    - Network-wide ad and tracker blocking
    - Encrypted upstream DNS (DoH, DoT, DoQ)
    - Per-client rules and filtering
    - Built-in DHCP server and DNS rewrites
    - Query log with live statistics
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/AdGuardHome/thumbnail.png
  category: network
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/adguard-home.svg
  homepage: https://adguard.com/adguard-home/overview.html
  web_port: WEB_PORT
  notes: >-
    Port 53 is often taken by the system's DNS resolver (systemd-resolved on Ubuntu). Change the DNS port, or free port 53, before pointing devices at it.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "3000"
    - key: DNS_PORT
      label: DNS port
      type: port
      default: "53"

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.65
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000"
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"
    volumes:
      - ${ATHENA_APP_DATA}/work:/opt/adguardhome/work
      - ${ATHENA_APP_DATA}/conf:/opt/adguardhome/conf
