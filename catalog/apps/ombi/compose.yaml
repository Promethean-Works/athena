x-athena:
  title: Ombi
  description: Media request manager for Plex, Jellyfin, and Emby users.
  tagline: Media request manager.
  tags: [Media, Requests, Plex, Jellyfin]
  license: "Apache-2.0"
  category: media
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ombi/icon.svg
  homepage: https://ombi.io
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ombi/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ombi/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8124"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  ombi:
    image: linuxserver/ombi:4.53.5
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3579/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
