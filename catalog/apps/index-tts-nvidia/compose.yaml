# Imported from the CasaOS AppStore (Apache-2.0): Apps/Index-TTS_Nvidia
x-athena:
  title: Index-TTS(Nvidia GPU)
  description: An Industrial-Level Controllable and Efficient Zero-Shot Text-To-Speech System
  category: utilities
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Index-TTS_Nvidia/icon.svg
  homepage: https://github.com/index-tts/index-tts
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/amd64
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '7867'
services:
  index-tts-nvidia:
    image: icewhaletech/index-tts:2.0
    container_name: index-tts
    restart: unless-stopped
    ports:
    - target: 7860
      published: ${WEB_PORT}
      protocol: tcp
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          memory: 8G
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
