# Imported from the CasaOS AppStore (Apache-2.0): Apps/playit-agent
x-athena:
  title: Playit Agent
  description: A free reverse proxy for tunneling services (not self-hosted).
  category: network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/playit-agent/icon.svg
  homepage: https://playit.gg
  web_port: null
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  smoke: skip
  smoke_note: needs a playit.gg agent secret key
  notes: >-
    Sign in at [playit.gg](https://playit.gg), add a Docker agent under **Agents**, and paste
    its secret key into the form. Then add tunnels for this agent on playit.gg.
  env:
  - key: SECRET_KEY
    label: Agent secret key
    type: password
    description: Shown when you add a Docker agent on playit.gg.
services:
  playit-agent:
    restart: unless-stopped
    image: ghcr.io/playit-cloud/playit-agent:2.0.2
    network_mode: host
    container_name: playit-agent
    environment:
      SECRET_KEY: ${SECRET_KEY}
