# Imported from the CasaOS AppStore (Apache-2.0): Apps/playit-agent
x-athena:
  title: Playit Agent
  description: A free reverse proxy for tunneling services (not self-hosted).
  category: network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/playit-agent/icon.svg
  homepage: https://playit.gg
  web_port: null
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  notes: This is the agent for use with playit.gg's reverse proxy. After having installed the container/app,
    you have to go to the settings of the container/app and go to the logs. The logs will tell you to
    click a link to activate the agent. Copy the link (you will have to do it manually with your cursor)
    and paste it in your web browser in a new tab. This will open a page asking you to login or register.
    If you have an account already then you can login. If not, register an account. Once you're logged
    in, it will ask to allow the agent. Allow the agent and remember the agent name. Then head over to
    https://playit.gg/account/agents. From there you need to select the correct agent, according to the
    agent name you just were to remember. From there you can add tunnels. Choose the options for the tunnel
    as you need, and a port in case of doing it manually with TCP, UDP and TCP+UDP. After that use the
    provided domain and port to connect to the tunnel and use that to get access to your tunneled serv
  env: []
services:
  playit-agent:
    restart: unless-stopped
    image: ghcr.io/playit-cloud/playit-agent:2.0.2
    network_mode: host
    container_name: playit-agent
