# Imported from the CasaOS AppStore (Apache-2.0): Apps/AdGuardHome
x-athena:
  title: AdGuard Home
  description: Network-wide ad and tracker blocking
  category: network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/AdGuardHome/icon.svg
  homepage: https://adguard.com/en/adguard-home/overview.html
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/386
  - linux/amd64
  - linux/arm
  - linux/arm64
  - linux/ppc64le
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '3001'
services:
  adguard-home:
    image: adguard/adguardhome:v0.107.79
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 53
      published: '53'
      protocol: tcp
    - target: 53
      published: '53'
      protocol: udp
    - target: 3000
      published: ${WEB_PORT}
      protocol: tcp
    - target: 853
      published: '853'
      protocol: tcp
    - target: 784
      published: '784'
      protocol: udp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/opt/adguardhome/work
      target: /opt/adguardhome/work
    - type: bind
      source: ${ATHENA_APP_DATA}/opt/adguardhome/conf
      target: /opt/adguardhome/conf
    container_name: adguard-home
