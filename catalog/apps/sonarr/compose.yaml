x-athena:
  title: Sonarr
  description: TV collection manager for Usenet and BitTorrent users.
  tagline: "Find, download and organise your TV shows."
  tags: [TV, Automation]
  license: "GPL-3.0"
  popular: true
  features:
    - Follows shows and grabs new episodes
    - Sends downloads to qBittorrent, Deluge or SABnzbd
    - Renames and organises files for Jellyfin or Plex
    - Calendar of upcoming episodes
  screenshots:
    - https://sonarr.tv/img/slider/overview.png
    - https://sonarr.tv/img/features/calendar.png
  category: media
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sonarr.svg
  homepage: https://sonarr.tv
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8989"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:v5.0.0.2997
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8989"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
