x-athena:
  title: Autobrr
  description: Automated torrent download manager for your media stack.
  tagline: Automated torrent download manager.
  tags: [Torrents, Automation, Downloads]
  license: "MIT"
  category: downloads
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Autobrr/icon.svg
  homepage: https://autobrr.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Autobrr/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Autobrr/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8166"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.90.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:7474/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
