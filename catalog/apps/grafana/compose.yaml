x-athena:
  title: Grafana
  description: Visualize and query metrics from Prometheus and other data sources.
  category: monitoring
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
  homepage: https://grafana.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "3003"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000"
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/data:/var/lib/grafana
