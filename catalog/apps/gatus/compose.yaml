x-athena:
  title: Gatus
  description: Developer-oriented health dashboard to monitor services and endpoints.
  tagline: "Monitor endpoints and get alerted when they go down."
  tags: [Monitoring, Alerts, Health checks]
  license: "Apache-2.0"
  features:
    - HTTP, TCP, ICMP and DNS health checks
    - Latency charts and uptime history
    - Alerts to email, Slack, Discord, PagerDuty and more
    - Configured entirely from one YAML file
  screenshots:
    - https://raw.githubusercontent.com/TwiN/gatus/master/.github/assets/dashboard-dark.jpg
  category: monitoring
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gatus.svg
  homepage: https://gatus.io
  web_port: WEB_PORT
  notes: A starter configuration is written to `config/config.yaml` in the app's data folder on the first start. Add your endpoints there and restart the app.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8097"

services:
  # Gatus stops when it has no configuration, so write a starter one on the first start.
  gatus-init:
    image: busybox:1.37
    restart: "no"
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
    command:
      - sh
      - -c
      - |
        [ -e /config/config.yaml ] && exit 0
        cat > /config/config.yaml <<'EOF'
        # Gatus configuration: https://github.com/TwiN/gatus#configuration
        # Restart the app after editing this file.
        storage:
          type: sqlite
          path: /data/data.db
        endpoints:
          - name: Gatus
            group: Example
            url: http://localhost:8080/health
            interval: 5m
            conditions:
              - "[STATUS] == 200"
        EOF
  gatus:
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    depends_on:
      gatus-init:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT}:8080"
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/data:/data
