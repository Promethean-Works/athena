x-athena:
  title: Open Notebook
  description: "Private, open-source take on NotebookLM: collect sources, chat with them, and generate notes and podcasts using the AI provider you choose."
  tagline: Private NotebookLM alternative.
  tags: [AI, Research, Notes]
  license: MIT
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/open-notebook.svg
  homepage: https://www.open-notebook.ai
  web_port: WEB_PORT
  notes: >-
    Add an AI provider (Ollama, OpenAI, Anthropic, …) under Settings → API keys before creating a notebook.
    Set an app password below if other people can reach this server.
  features:
    - Chat with PDFs, web pages, audio and video
    - Multi-speaker podcast generation
    - Works with Ollama and 16+ providers
    - REST API for automation
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8225"
    - key: API_PORT
      label: API port
      type: port
      default: "8226"
      advanced: true
    - key: APP_PASSWORD
      label: App password
      description: Protects the web UI. Leave empty for no password.
      type: password
      required: false
    - key: ENCRYPTION_KEY
      label: Encryption key
      description: Encrypts saved provider API keys. Don't change it after first start.
      type: password
      generate: secret
      advanced: true
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    restart: unless-stopped
    user: root
    command: ["start", "--log", "info", "--user", "root", "--pass", "${DB_PASSWORD}", "rocksdb:/mydata/mydatabase.db"]
    volumes:
      - ${ATHENA_APP_DATA}/surreal:/mydata
  open-notebook:
    image: lfnovo/open_notebook:1.15.1
    restart: unless-stopped
    depends_on:
      - surrealdb
    ports:
      - "${WEB_PORT}:8502"
      - "${API_PORT}:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPEN_NOTEBOOK_PASSWORD: ${APP_PASSWORD}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: root
      SURREAL_PASSWORD: ${DB_PASSWORD}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
    volumes:
      - ${ATHENA_APP_DATA}/data:/app/data
