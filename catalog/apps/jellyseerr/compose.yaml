x-athena:
  title: Jellyseerr
  description: Free and open source application for managing requests for your media library.
  tagline: Manage media requests for your Jellyfin/Plex library.
  tags: [Media, Requests, Movies, TV]
  license: "GPL-3.0"
  category: media
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Jellyseerr/icon.svg
  homepage: https://jellyseerr.dev
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Jellyseerr/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Jellyseerr/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8108"

services:
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5055/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/app/config
