x-athena:
  title: SwingMusic
  description: Self-hosted music streaming server with a modern web interface and mobile apps.
  tagline: Self-hosted music streaming.
  tags: [Music, Streaming, Server]
  license: "GPL-3.0"
  category: media
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/SwingMusic/icon.svg
  homepage: https://swingmusic.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/SwingMusic/thumbnail.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/SwingMusic/screenshot-1.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8141"
    - key: MUSIC_PATH
      label: Music folder
      type: path
      description: The folder with your music library.
      default: "@app_data/music"

services:
  swingmusic:
    image: ghcr.io/swingmx/swingmusic:v2.1.4
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:1970/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${MUSIC_PATH}:/music
