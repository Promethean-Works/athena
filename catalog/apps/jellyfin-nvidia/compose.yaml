# Imported from the CasaOS AppStore (Apache-2.0): Apps/Jellyfin_Nvidia
x-athena:
  title: Jellyfin(Nvidia GPU)
  description: The personal Media System
  category: media
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/icon.svg
  homepage: https://jellyfin.org/
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/amd64
  - linux/arm64
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '8097'
  - key: PGID
    label: Group ID
    default: '@gid'
    advanced: true
  - key: PUID
    label: User ID
    default: '@uid'
    advanced: true
  - key: TZ
    label: Timezone
    default: '@timezone'
    advanced: true
  - key: MEDIA_PATH
    label: Media folder
    type: path
    default: '@app_data/media'
    description: The CasaOS Media folder.
services:
  jellyfin:
    devices:
    - /dev/dri:/dev/dri
    - /dev/vcsm:/dev/vcsm
    - /dev/vchiq:/dev/vchiq
    - /dev/video10:/dev/video10
    - /dev/video11:/dev/video11
    - /dev/video12:/dev/video12
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
      TZ: ${TZ}
      CPU_FALLBACK: 'true'
      NVIDIA_VISIBLE_DEVICES: all
    image: linuxserver/jellyfin:10.10.6
    deploy:
      resources:
        reservations:
          memory: 256M
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    network_mode: bridge
    ports:
    - target: 8096
      published: ${WEB_PORT}
      protocol: tcp
    - target: 8920
      published: '8921'
      protocol: tcp
    - target: 7359
      published: '7359'
      protocol: tcp
    - target: 1900
      published: '1901'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/config
      target: /config
    - type: bind
      source: ${MEDIA_PATH}
      target: /Media
    - type: bind
      source: /opt/vc/lib
      target: /opt/vc/lib
    container_name: jellyfin
