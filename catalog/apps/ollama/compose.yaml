x-athena:
  title: Ollama
  description: Run large language models locally with a simple API.
  category: development
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/ollama.svg
  homepage: https://ollama.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: API port
      type: port
      default: "11434"

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:11434"
    volumes:
      - ${ATHENA_APP_DATA}/ollama:/root/.ollama
