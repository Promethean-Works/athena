x-athena:
  title: Transmission
  description: A fast and easy BitTorrent client with a web interface.
  tagline: "A lightweight BitTorrent client with a web UI."
  tags: [BitTorrent, Downloads]
  license: "GPL-3.0"
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Transmission/thumbnail.png
  category: downloads
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/transmission.svg
  homepage: https://transmissionbt.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "9091"
    - key: DOWNLOADS_PATH
      label: Downloads folder
      type: path
      description: Where finished downloads go.
      default: "@app_data/downloads"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls370
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:9091"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${DOWNLOADS_PATH}:/downloads
