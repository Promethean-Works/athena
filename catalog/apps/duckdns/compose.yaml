x-athena:
  title: DuckDNS
  description: Free dynamic DNS client for keeping your domain synced with your IP.
  tagline: Free dynamic DNS client.
  tags: [DDNS, DNS, Network]
  license: "GPL-3.0"
  category: network
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/DuckDNS/icon.svg
  homepage: https://www.duckdns.org
  web_port: null
  smoke: skip
  smoke_note: needs a DuckDNS account token
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/DuckDNS/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/DuckDNS/screenshot-2.png
  env:
    - key: SUBDOMAINS
      label: Subdomains
      description: Your DuckDNS subdomains, comma separated, without .duckdns.org.
    - key: TOKEN
      label: Token
      type: password
      description: Shown at the top of duckdns.org after you sign in.
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  duckdns:
    image: linuxserver/duckdns:version-ddf6a18c
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${SUBDOMAINS}
      TOKEN: ${TOKEN}
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
