x-athena:
  title: SABnzbd
  description: Usenet downloader that makes retrieving files from Usenet simple.
  tagline: "Usenet downloading made simple."
  tags: [Usenet, Downloads]
  license: "GPL-2.0"
  category: downloads
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sabnzbd.svg
  homepage: https://sabnzbd.org
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8080"
    - key: DOWNLOADS_PATH
      label: Downloads folder
      type: path
      description: Where finished downloads go.
      default: "@app_data/downloads"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${DOWNLOADS_PATH}:/downloads
