x-athena:
  title: Qui
  description: Web interface for managing and monitoring your torrents and downloads.
  tagline: Torrent download manager.
  tags: [Downloads, Torrents, Management]
  license: "MIT"
  category: downloads
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Qui/icon.svg
  homepage: https://github.com/autobrr/qui
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Qui/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Qui/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8217"

services:
  qui:
    image: ghcr.io/autobrr/qui:v1.28.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:7476/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
