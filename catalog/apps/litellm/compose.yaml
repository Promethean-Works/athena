x-athena:
  title: LiteLLM
  description: One OpenAI-compatible gateway in front of Ollama, OpenAI, Anthropic, Gemini and 100+ other model providers, with keys, budgets and logs.
  tagline: One API for every LLM provider.
  tags: [AI, LLM, Gateway]
  license: MIT
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/BerriAI/litellm/main/litellm/proxy/logo.png
  homepage: https://docs.litellm.ai
  web_port: WEB_PORT
  notes: >-
    Open `/ui` to add models and create virtual API keys. Sign in as `admin` with the UI password
    below; API clients use the master key (`sk-` plus the value shown in the app's settings).
  features:
    - OpenAI-compatible API for 100+ providers, including local Ollama
    - Virtual keys with per-key budgets and rate limits
    - Spend tracking and request logs
    - Load balancing and fallbacks between models
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8219"
    - key: MASTER_KEY
      label: Master key
      description: Admin API key. The proxy expects it with an `sk-` prefix.
      type: password
      generate: secret
    - key: UI_PASSWORD
      label: Admin UI password
      type: password
      generate: secret
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true

services:
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:4000"
    environment:
      LITELLM_MASTER_KEY: sk-${MASTER_KEY}
      UI_USERNAME: admin
      UI_PASSWORD: ${UI_PASSWORD}
      DATABASE_URL: postgresql://litellm:${DB_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
