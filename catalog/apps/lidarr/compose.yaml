x-athena:
  title: Lidarr
  description: Music collection manager for Usenet and BitTorrent users.
  tagline: "Music collection manager for Usenet and BitTorrent."
  tags: [Music, Automation]
  license: "GPL-3.0"
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Lidarr/thumbnail.png
  category: media
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/lidarr.svg
  homepage: https://lidarr.audio
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8686"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly-4.0.0.5227-ls227
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8686"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
