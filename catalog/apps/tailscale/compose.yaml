x-athena:
  title: Tailscale
  description: Mesh VPN for securely connecting your devices and services anywhere.
  tagline: Mesh VPN for your devices.
  tags: [VPN, Network, Security]
  license: "BSD-3-Clause"
  category: network
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tailscale/icon.svg
  homepage: https://tailscale.com
  web_port: null
  notes: >-
    With an auth key (Tailscale admin console → Settings → Keys) the server joins your
    tailnet on its own. Without one, open the app's logs and follow the login link.
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tailscale/icon.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tailscale/screenshot-1.png
  env:
    - key: TS_AUTHKEY
      label: Auth key
      type: password
      description: Optional. Without it, sign in with the link in the app's logs.
      required: false
    - key: TS_HOSTNAME
      label: Machine name
      default: athena

services:
  tailscale:
    image: tailscale/tailscale:v1.98.3
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ${ATHENA_APP_DATA}/data:/var/lib/tailscale
