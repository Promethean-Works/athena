x-athena:
  title: Downtify
  description: Website uptime monitoring with alerts and status page generation.
  tagline: Website uptime monitoring.
  tags: [Monitoring, Uptime, Alerts]
  license: "MIT"
  category: monitoring
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Downtify/icon.svg
  homepage: https://downtify.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Downtify/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Downtify/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8183"

services:
  downtify:
    image: ghcr.io/downtify/downtify:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
