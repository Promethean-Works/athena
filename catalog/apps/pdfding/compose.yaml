# Imported from the CasaOS AppStore (Apache-2.0): Apps/PdfDing
x-athena:
  title: PdfDing
  description: Selfhosted PDF manager, viewer and editor
  category: documents
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/PdfDing/icon.svg
  homepage: https://www.pdfding.com
  web_port: WEB_PORT
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  notes: 'After installation, you can access PdfDing at http://your-server-ip:8000. Create your first
    admin account during the initial setup.


    Note: If you encounter access issues, you may need to manually edit the docker-compose.yml file and
    replace the HOST_NAME environment variable with your actual server IP address.'
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '8001'
  - key: SECRET_KEY
    label: Secret key
    type: password
    generate: secret
services:
  pdfding-init:
    # The app runs as uid 1000, but Docker creates a missing data folder as root on Linux.
    image: mrmn/pdfding:v1.7.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /home/nonroot/pdfding/db /home/nonroot/pdfding/media"]
    restart: "no"
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/db
      target: /home/nonroot/pdfding/db
    - type: bind
      source: ${ATHENA_APP_DATA}/media
      target: /home/nonroot/pdfding/media
  pdfding:
    depends_on:
      pdfding-init:
        condition: service_completed_successfully
    image: mrmn/pdfding:v1.7.2
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
    - target: 8000
      published: ${WEB_PORT}
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/db
      target: /home/nonroot/pdfding/db
    - type: bind
      source: ${ATHENA_APP_DATA}/media
      target: /home/nonroot/pdfding/media
    environment:
    - HOST_NAME=*
    - SECRET_KEY=${SECRET_KEY}
    - CSRF_COOKIE_SECURE=FALSE
    - SESSION_COOKIE_SECURE=FALSE
    - DEBUG=FALSE
