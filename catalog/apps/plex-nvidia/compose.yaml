# Imported from the CasaOS AppStore (Apache-2.0): Apps/Plex_Nvidia
x-athena:
  title: Plex(Nvidia GPU)
  description: Stream Movies & TV Shows
  category: media
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Plex/icon.svg
  homepage: https://www.plex.tv
  web_port: 32400
  web_path: /web/index.html
  platforms:
  - linux/amd64
  - linux/arm64
  notes: "## Plex\n\n#### Stream Movies & TV Shows <br>\n\n*FAQ*\nAuthorized Files and Data to Plex\n\n\
    1. Click setting via top right menu of App icon\n2. map your device's media location in 'Host Path'\
    \ and link it to Plex's 'Container Path' at /Media for seamless access.\n  To add a media library\
    \ in Plex\n3. Go to Plex settings\n4. click 'Add Library'\n5. select your media type, and specify\
    \ the path, such as /Media, where your media files are stored for Plex to catalog and include in your\
    \ library."
  env:
  - key: PGID
    label: Group ID
    default: '@gid'
    advanced: true
  - key: PUID
    label: User ID
    default: '@uid'
    advanced: true
  - key: MEDIA_PATH
    label: Media folder
    type: path
    default: '@app_data/media'
    description: The CasaOS Media folder.
services:
  plex:
    devices:
    - /dev/dri:/dev/dri
    - /dev/dvb:/dev/dvb
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
      VERSION: docker
      CPU_FALLBACK: 'true'
      NVIDIA_VISIBLE_DEVICES: all
    image: lscr.io/linuxserver/plex:1.43.3
    deploy:
      resources:
        reservations:
          memory: 256M
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/config
      target: /config
    - type: bind
      source: ${MEDIA_PATH}
      target: /Media
    container_name: plex
