x-athena:
  title: Excalidraw
  description: Virtual hand-drawn style whiteboard platform for infinite canvas collaboration and diagramming.
  tagline: Virtual whiteboard for hand-drawn diagrams.
  tags: [Whiteboard, Diagrams, Collaboration]
  license: "MIT"
  category: productivity
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Excalidraw/icon.svg
  homepage: https://excalidraw.com/
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Excalidraw/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Excalidraw/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8107"

services:
  excalidraw:
    image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80/tcp"
