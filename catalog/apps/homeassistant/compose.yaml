# Imported from the CasaOS AppStore (Apache-2.0): Apps/HomeAssistant
x-athena:
  title: Home Assistant
  description: Open source home automation that puts local control and privacy first.
  category: home
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/HomeAssistant/icon.svg
  homepage: https://www.home-assistant.io
  web_port: 8123
  web_path: /
  platforms:
  - linux/amd64
  - linux/arm64
  notes: null
  env:
  - key: PGID
    label: Group ID
    default: '@gid'
    advanced: true
  - key: PUID
    label: User ID
    default: '@uid'
    advanced: true
  - key: TZ
    label: Timezone
    default: '@timezone'
    advanced: true
services:
  homeassistant:
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
      TZ: ${TZ}
    image: homeassistant/home-assistant:2026.5.4
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/config
      target: /config
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
    - type: bind
      source: /run/dbus
      target: /run/dbus
      read_only: true
    privileged: true
    container_name: homeassistant
