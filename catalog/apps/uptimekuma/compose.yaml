# Imported from the CasaOS AppStore (Apache-2.0): Apps/UptimeKuma
x-athena:
  title: Uptime Kuma
  description: A fancy monitoring tool
  category: network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/UptimeKuma/icon.svg
  homepage: https://uptimekuma.org
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/amd64
  - linux/arm64
  - linux/arm
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '3001'
services:
  uptimekuma:
    image: louislam/uptime-kuma:2.4.0
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
    - target: 3001
      published: ${WEB_PORT}
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/app/data
      target: /app/data
    container_name: uptimekuma
