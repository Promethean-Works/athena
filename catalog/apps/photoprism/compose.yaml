x-athena:
  title: PhotoPrism
  description: AI-powered photos app for the decentralized web.
  tagline: "AI-powered photo management that runs on your own box."
  tags: [Photos, AI, Search]
  license: "AGPL-3.0"
  features:
    - Automatic indexing of photo folders
    - Face and content recognition
    - Search by place, camera, colour and content
    - Albums, favourites and sharing links
  screenshots:
    - https://dl.photoprism.app/img/ui/2025/desktop-search.jpg
  category: media
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/photoprism.svg
  homepage: https://photoprism.app
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "2342"
    - key: ADMIN_PASSWORD
      label: Admin password
      type: password
      generate: secret
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  photoprism:
    image: photoprism/photoprism:261029-963b58c50
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:2342"
    environment:
      TZ: ${TZ}
      PHOTOPRISM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/storage:/photoprism/storage
      - ${ATHENA_APP_DATA}/originals:/photoprism/originals
