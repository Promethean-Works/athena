x-athena:
  title: Immich
  description: Self-hosted photo and video backup with AI search.
  tagline: "Self-hosted photo and video backup with AI search."
  tags: [Photos, Backup, AI, Mobile apps]
  license: "AGPL-3.0"
  popular: true
  features:
    - Automatic background backup from phones
    - Face, object and text search
    - Shared albums and partner sharing
    - Timeline, maps and memories
    - RAW support and video playback
  screenshots:
    - https://raw.githubusercontent.com/immich-app/immich/main/design/immich-screenshots.png
  category: media
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
  homepage: https://immich.app
  web_port: WEB_PORT
  notes: >-
    Create the admin account on first visit, then install the Immich app on your phone
    and point it at this address. The machine-learning container downloads its models
    on the first upload.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "2283"
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.1
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:2283"
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-database
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    volumes:
      - ${ATHENA_APP_DATA}/library:/data
    depends_on:
      - immich-redis
      - immich-database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/model-cache:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
