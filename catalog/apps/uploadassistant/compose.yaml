x-athena:
  title: UploadAssistant
  description: Media upload assistant for organizing and uploading content to your media server.
  tagline: Media upload assistant.
  tags: [Media, Upload, Organization]
  license: "MIT"
  category: media
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/video.svg
  homepage: https://uploadassistant.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/UploadAssistant/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/UploadAssistant/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8150"
    - key: MEDIA_PATH
      label: Media folder
      type: path
      description: The folder with the releases to upload; the web UI can browse it.
      default: "@app_data/media"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  uploadassistant:
    image: ghcr.io/wastaken7/upload-assistant:v4.9
    restart: unless-stopped
    command: ["--webui", "0.0.0.0:5000"]
    ports:
      - "${WEB_PORT}:5000/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UA_BROWSE_ROOTS: /data/media,/state/tmp
    volumes:
      - ${ATHENA_APP_DATA}/state:/state
      - ${ATHENA_APP_DATA}/webui-auth:/root/.config/upload-assistant
      - ${MEDIA_PATH}:/data/media
    stop_grace_period: 15s
