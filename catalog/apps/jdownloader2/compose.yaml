x-athena:
  title: JDownloader2
  description: Automated download manager for file hosting sites and Usenet.
  tagline: Automated download manager.
  tags: [Downloads, Download Manager]
  license: "GPL-2.0"
  category: downloads
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/JDownloader2/icon.svg
  homepage: https://jdownloader.org
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/JDownloader2/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/JDownloader2/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8202"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  jdownloader2:
    image: lscr.io/linuxserver/jdownloader2:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5800/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/downloads:/downloads
