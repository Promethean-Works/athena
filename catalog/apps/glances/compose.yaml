x-athena:
  title: Glances
  description: System monitoring tool with a web dashboard for CPU, memory, disk, and network.
  tagline: System monitoring dashboard.
  tags: [Monitoring, System, Stats]
  license: "BSD-2-Clause"
  category: monitoring
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Glances/icon.svg
  homepage: https://nicolargo.github.io/glances
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Glances/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Glances/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8194"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  glances:
    image: nicolargo/glances:4.5.9-full
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:61208/tcp"
    environment:
      GLANCES_OPT: "-w"
      PUID: ${PUID}
      PGID: ${PGID}
