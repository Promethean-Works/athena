x-athena:
  title: Speaches
  description: "OpenAI-compatible speech server: transcribe audio with Whisper and generate speech, running on your own hardware."
  tagline: Local speech-to-text and text-to-speech API.
  tags: [AI, Speech, Whisper]
  license: MIT
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://github.com/speaches-ai.png
  homepage: https://speaches.ai
  web_port: WEB_PORT
  notes: >-
    Models download on first use. Open the web UI or call `POST /v1/models/<id>` to fetch one
    (for example `Systran/faster-whisper-small`). This is the CPU build.
  features:
    - Drop-in replacement for the OpenAI audio API
    - Speech-to-text with faster-whisper
    - Text-to-speech with Kokoro and Piper voices
    - Works with Open WebUI and Home Assistant
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8221"

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000"
    volumes:
      - ${ATHENA_APP_DATA}/models:/home/ubuntu/.cache/huggingface/hub
