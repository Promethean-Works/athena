x-athena:
  title: NZBGet
  description: Usenet downloader written in C++, optimized for speed and low system load.
  tagline: "A fast Usenet downloader with a web UI."
  tags: [Usenet, Downloads]
  license: "GPL-2.0"
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Nzbget/thumbnail.png
  category: downloads
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nzbget.svg
  homepage: https://nzbget.net
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "6789"
    - key: DOWNLOADS_PATH
      label: Downloads folder
      type: path
      description: Where finished downloads go.
      default: "@app_data/downloads"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:v26.3-ls272
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:6789"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${DOWNLOADS_PATH}:/downloads
