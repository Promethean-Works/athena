# Imported from the CasaOS AppStore (Apache-2.0): Apps/Ollama_Nvidia
x-athena:
  title: Ollama(Nvidia GPU)
  description: Get up and running with large language models locally
  category: utilities
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Ollama/icon.svg
  homepage: https://ollama.com/
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/amd64
  - linux/arm64
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '11434'
services:
  ollama:
    image: ollama/ollama:0.9.5
    container_name: ollama
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    restart: unless-stopped
    ports:
    - target: 11434
      published: ${WEB_PORT}
      protocol: tcp
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/
      target: /root/.ollama
