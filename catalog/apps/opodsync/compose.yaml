x-athena:
  title: oPodSync
  description: Podcast sync and download manager for organizing your audio subscriptions.
  tagline: Podcast sync manager.
  tags: [Podcasts, Audio, Sync]
  license: "MIT"
  category: media
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/oPodSync/icon.svg
  homepage: https://opodsync.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/oPodSync/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/oPodSync/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8161"

services:
  opodsync:
    image: ganeshlab/opodsync:latest@sha256:605c5e78bfe5392cdc4557d3d6f02d28eb709c5d5b5cf1c15d4500fc2e6f8319
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
