x-athena:
  variant:
    label: PostgreSQL
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8083"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true
    - key: DB_PASSWORD
      label: PostgreSQL password
      type: password
      generate: secret
      advanced: true
      description: Password for the bundled PostgreSQL database.

services:
  freshrss:
    image: freshrss/freshrss:1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    environment:
      TZ: ${TZ}
      CRON_MIN: "*/20"
      # Auto-install FreshRSS with PostgreSQL on first start.
      FRESHRSS_INSTALL: |
        --db-type pgsql
        --db-host postgres
        --db-user freshrss
        --db-password ${DB_PASSWORD}
        --db-base freshrss
        --default-user admin
        --api-enabled
    volumes:
      - ${ATHENA_APP_DATA}/data:/var/www/FreshRSS/data
      - ${ATHENA_APP_DATA}/extensions:/var/www/FreshRSS/extensions

  postgres:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "freshrss", "-d", "freshrss"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data