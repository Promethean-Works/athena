x-athena:
  title: FreshRSS
  description: A fast, self-hosted RSS and Atom feed reader.
  tagline: "A fast, self-hosted RSS and Atom feed reader."
  tags: [RSS, Reading]
  license: "AGPL-3.0"
  features:
    - Subscribe to RSS and Atom feeds in one place
    - Keep articles read and starred across devices
    - Mobile-friendly theme and a responsive reader
    - Extensions for full-text search and scraping
  screenshots:
    - https://raw.githubusercontent.com/FreshRSS/FreshRSS/edge/docs/img/FreshRSS-screenshot.png
  category: productivity
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/freshrss.svg
  homepage: https://freshrss.org
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8083"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true
    - key: DATABASE_BACKEND
      label: Database backend
      type: select
      options:
        - sqlite
        - pgsql
      default: sqlite
      description: >
        SQLite is built into FreshRSS and needs no extra container.
        PostgreSQL runs as a bundled database container; FreshRSS is
        configured to use the selected backend on first start.
    - key: DB_PASSWORD
      label: PostgreSQL password
      type: password
      generate: secret
      advanced: true
      description: Password for the bundled PostgreSQL database.

services:
  freshrss:
    image: freshrss/freshrss:1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    environment:
      TZ: ${TZ}
      CRON_MIN: "*/20"
      # Auto-install FreshRSS with the chosen database backend on first start.
      # SQLite is the built-in default; PostgreSQL connects to the bundled
      # `postgres` service. `--default-user` is required by the installer.
      FRESHRSS_INSTALL: |
        --db-type ${DATABASE_BACKEND}
        --db-host postgres
        --db-user freshrss
        --db-password ${DB_PASSWORD}
        --db-base freshrss
        --default-user admin
        --api-enabled
    volumes:
      - ${ATHENA_APP_DATA}/data:/var/www/FreshRSS/data
      - ${ATHENA_APP_DATA}/extensions:/var/www/FreshRSS/extensions

  postgres:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["pg_isready", "-U", "freshrss", "-d", "freshrss"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
