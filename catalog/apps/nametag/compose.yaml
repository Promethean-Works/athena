x-athena:
  title: Nametag
  description: A personal CRM for the people in your life
  category: productivity
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Nametag/icon.png
  homepage: https://nametag.one
  web_port: WEB_PORT
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  notes: >-
    Before installing, set NEXTAUTH_URL to the address you will open Nametag at, for example http://192.168.1.10:10300
    (use your server IP or domain). The default, http://localhost:10300, only works from the server device
    itself, and sign-in and email links will point to the wrong place.

    After installing, open Nametag and create your account. Anyone who can reach this port can also register,
    so once your account exists you can add DISABLE_REGISTRATION=true to close sign-ups.

    Email is optional. To send reminder and password-reset emails, add the SMTP_* variables described
    at https://docs.nametag.one/self-hosting/email/
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "10300"
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true
      description: Password for the bundled PostgreSQL database.
    - key: NEXTAUTH_URL
      label: NextAuth URL
      type: text
      default: "http://localhost:10300"
      advanced: true
      description: The public URL for Nametag (required for email links and OAuth).
    - key: NEXTAUTH_SECRET
      label: NextAuth secret
      type: password
      generate: secret
      advanced: true
    - key: CRON_SECRET
      label: Cron secret
      type: password
      generate: secret
      advanced: true

services:
  nametag:
    image: ghcr.io/mattogodoy/nametag:0.64.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      DB_HOST: nametag-db
      DB_PORT: "5432"
      DB_NAME: nametag
      DB_USER: nametag
      DB_PASSWORD: ${DB_PASSWORD}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ${ATHENA_APP_DATA}/data:/app/data
    depends_on:
      nametag-db:
        condition: service_healthy
    networks:
      - nametag

  nametag-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nametag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nametag
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nametag -d nametag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nametag

networks:
  nametag:
    name: nametag