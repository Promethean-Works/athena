x-athena:
  title: Pi-hole
  description: Network-wide ad and tracker blocking DNS server with a web dashboard.
  tagline: Network-wide ad blocking DNS server.
  tags: [DNS, Ad Blocking, Network]
  license: "EUPL-1.2"
  category: network
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pihole/icon.svg
  homepage: https://pi-hole.net
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pihole/icon.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pihole/screenshot-1.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8214"
    - key: DNS_PORT
      label: DNS port
      type: port
      default: "53"
      description: Devices on your network send DNS queries here. Keep 53 unless another DNS server already uses it.
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true
    - key: WEBPASSWORD
      label: Web admin password
      type: password
      generate: secret

services:
  pihole:
    image: pihole/pihole:2026.05.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80/tcp"
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      FTLCONF_dns_listeningMode: all
    volumes:
      - ${ATHENA_APP_DATA}/etc-pihole:/etc/pihole
      - ${ATHENA_APP_DATA}/etc-dnsmasq.d:/etc/dnsmasq.d
