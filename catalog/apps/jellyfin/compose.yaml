x-athena:
  title: Jellyfin
  description: Stream your movies, shows and music to any device.
  tagline: "Your own streaming service for movies, shows and music."
  tags: [Movies, TV, Music, Transcoding]
  license: "GPL-2.0"
  popular: true
  features:
    - Stream to TVs, phones, browsers and DLNA devices
    - Hardware transcoding when the host supports it
    - Live TV and DVR with a tuner
    - Subtitles, trailers and collections
    - Apps for Android, iOS, Roku and more
  category: media
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg
  homepage: https://jellyfin.org
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8096"
    - key: MEDIA_PATH
      label: Media folder
      type: path
      description: The folder with your movies, shows and music.
      default: "@app_data/media"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8096"
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/cache:/cache
      - ${MEDIA_PATH}:/media:ro
