x-athena:
  title: Twingate
  description: Zero-trust network access solution for secure remote access to applications.
  tagline: Zero-trust network access.
  tags: [Zero Trust, VPN, Security]
  license: "Proprietary"
  category: network
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Twingate/icon.svg
  homepage: https://twingate.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Twingate/thumbnail.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Twingate/icon.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8147"
  services:
    twingate:
      image: twingate/connector:1
      restart: unless-stopped
      ports:
        - "${WEB_PORT}:80/tcp"
      volumes:
        - ${ATHENA_APP_DATA}/data:/data
