x-athena:
  title: IT Tools
  description: Handy online tools for developers, like encoders, converters and generators.
  tagline: "A toolbox of handy converters and generators."
  tags: [Tools, Developer]
  license: "GPL-3.0"
  category: utilities
  platforms: [linux/amd64, linux/arm64]
  screenshots:
    - https://raw.githubusercontent.com/CorentinTh/it-tools/main/public/banner.png
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/it-tools.svg
  homepage: https://it-tools.tech
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8086"

services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
