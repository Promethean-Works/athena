x-athena:
  title: Tautulli
  description: Monitoring and tracking tool for Plex Media Server usage and statistics.
  tagline: Plex monitoring and statistics.
  tags: [Plex, Monitoring, Statistics]
  license: "GPL-3.0"
  category: media
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tautulli/icon.svg
  homepage: https://tautulli.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tautulli/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Tautulli/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8143"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
  services:
    tautulli:
      image: linuxserver/tautulli:2.17.1
      restart: unless-stopped
      ports:
        - "${WEB_PORT}:8181/tcp"
      environment:
        PUID: ${PUID}
        PGID: ${PGID}
      volumes:
        - ${ATHENA_APP_DATA}/config:/config
