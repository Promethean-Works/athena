x-athena:
  title: SearXNG
  description: Private metasearch engine that queries dozens of search sites without tracking you.
  tagline: Private metasearch engine, no tracking.
  tags: [Search, Privacy, AI]
  license: AGPL-3.0
  category: ai
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/searxng.svg
  homepage: https://docs.searxng.org
  web_port: WEB_PORT
  notes: >-
    Settings are in `files/settings.yml` in the app's folder, written once so your edits stay. JSON output is
    already on, so Open WebUI, Vane and other AI apps can use this as their web-search tool
    (`http://<server>:<port>/search?q=…&format=json`).
  features:
    - Aggregates results from 70+ search engines
    - No tracking, no profiling, no ads
    - JSON output for AI assistants and RAG pipelines (enable in settings)
    - Works as a browser search engine
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8218"
    - key: SECRET
      label: Secret key
      type: password
      generate: hex32
      advanced: true

services:
  searxng:
    image: docker.io/searxng/searxng:2026.11.23-a7163d091
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080"
    environment:
      SEARXNG_SECRET: ${SECRET}
    volumes:
      - ./files/settings.yml:/etc/searxng/settings.yml
      - ${ATHENA_APP_DATA}/cache:/var/cache/searxng
