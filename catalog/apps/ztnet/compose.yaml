x-athena:
  title: Ztnet
  description: ZeroTier network management and monitoring web interface.
  tagline: ZeroTier network management.
  tags: [ZeroTier, VPN, Network]
  license: "MIT"
  category: network
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ztnet/icon.svg
  homepage: https://zerotier.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ztnet/icon.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ztnet/screenshot-1.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8157"
  services:
    ztnet:
      image: sinamics/ztnet:0.7.18
      restart: unless-stopped
      ports:
        - "${WEB_PORT}:3050/tcp"
      volumes:
        - ${ATHENA_APP_DATA}/data:/data
