x-athena:
  title: RetroArch
  description: Emulator frontend supporting a wide range of classic game consoles and computers.
  tagline: Classic game emulator frontend.
  tags: [Gaming, Emulator, Retro]
  license: "GPL-3.0"
  category: home
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RetroArch/icon.svg
  homepage: https://www.retroarch.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RetroArch/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/RetroArch/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8132"

services:
  retroarch:
    image: lscr.io/linuxserver/retroarch:1.22.2
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3001/tcp"
    environment:
      PUID: "@uid"
      PGID: "@gid"
    volumes:
      - ${ATHENA_APP_DATA}/data:/config
    shm_size: "1gb"
