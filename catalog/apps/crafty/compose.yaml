x-athena:
  title: Crafty
  description: Minecraft server manager with web interface, modpack support, and console.
  tagline: Minecraft server manager.
  tags: [Minecraft, Gaming, Server]
  license: "MIT"
  category: home
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Crafty/icon.svg
  homepage: https://crafty-controller.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Crafty/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Crafty/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8176"

services:
  crafty:
    image: arcadiatechnology/crafty-4:v4.11.1
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/config:/crafty/app/config
      - ${ATHENA_APP_DATA}/servers:/crafty/servers
      - ${ATHENA_APP_DATA}/backups:/crafty/backups
      - ${ATHENA_APP_DATA}/logs:/crafty/logs
      - ${ATHENA_APP_DATA}/import:/crafty/import
