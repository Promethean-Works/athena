x-athena:
  title: n8n
  description: Workflow automation tool that connects apps and services.
  category: development
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/n8n.svg
  homepage: https://n8n.io
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "5678"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5678"
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/data:/home/node/.n8n
