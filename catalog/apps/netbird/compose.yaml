# Imported from the CasaOS AppStore (Apache-2.0): Apps/NetBird
x-athena:
  title: NetBird
  description: Connect your devices into a secure WireGuard®-based overlay network with SSO, MFA and granular
    access controls.
  category: network
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/NetBird/icon.svg
  homepage: https://netbird.io
  web_port: null
  web_path: /
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  smoke: skip
  smoke_note: needs a NetBird setup key
  notes: >-
    In your NetBird dashboard ([app.netbird.io](https://app.netbird.io) or your self-hosted
    one), open **Setup Keys**, create a key and paste it into the form. This server then
    shows up as a peer in your network.
  env:
  - key: NB_SETUP_KEY
    label: Setup key
    type: password
    description: From the Setup Keys page of your NetBird dashboard.
  - key: NB_HOSTNAME
    label: Peer name
    default: athena
  - key: NB_MANAGEMENT_URL
    label: Management URL
    description: Only for a self-hosted NetBird; leave empty for app.netbird.io.
    required: false
    advanced: true
services:
  netbird:
    image: netbirdio/netbird:0.62.3
    container_name: netbird
    network_mode: host
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
    deploy:
      resources:
        reservations:
          memory: 128M
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL}
      NB_HOSTNAME: ${NB_HOSTNAME}
      NB_ENABLE_SSH_ROOT: 'true'
      NB_ALLOW_SERVER_SSH: 'true'
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}
      target: /var/lib/netbird
