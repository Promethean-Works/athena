x-athena:
  title: Node-RED
  description: Low-code, flow-based programming for automations and IoT.
  tagline: "Wire devices and APIs together with a visual flow editor."
  tags: [Automation, IoT, Flows]
  license: "Apache-2.0"
  features:
    - Drag-and-drop flows in the browser
    - Thousands of community nodes
    - MQTT, HTTP, WebSocket and serial built in
    - Great companion to Home Assistant
  screenshots:
    - https://nodered.org/images/node-red-screenshot.png
  category: home
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/node-red.svg
  homepage: https://nodered.org
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "1880"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  node-red:
    image: nodered/node-red:4.1
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:1880"
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
