x-athena:
  title: Deluge
  description: A lightweight BitTorrent client with a web interface.
  tagline: "A BitTorrent client with a full web interface."
  tags: [BitTorrent, Downloads]
  license: "GPL-3.0"
  category: downloads
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/deluge.svg
  homepage: https://deluge-torrent.org
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8112"
    - key: DOWNLOADS_PATH
      label: Downloads folder
      type: path
      description: Where finished downloads go.
      default: "@app_data/downloads"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0-ls387
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8112"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${DOWNLOADS_PATH}:/downloads
