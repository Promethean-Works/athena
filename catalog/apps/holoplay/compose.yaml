x-athena:
  title: HoloPlay
  description: Holographic display management and content player for Looking Glass devices.
  tagline: Holographic display player.
  tags: [Holographic, Display, Player]
  license: "MIT"
  category: home
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/HoloPlay/icon.svg
  homepage: https://lookingglassfactory.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/HoloPlay/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/HoloPlay/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8198"

services:
  holoplay:
    image: spout8301/holoplay:1.12.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
