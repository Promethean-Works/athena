# Imported from the CasaOS AppStore (Apache-2.0): Apps/Index-TTS
x-athena:
  title: Index-TTS
  description: An Industrial-Level Controllable and Efficient Zero-Shot Text-To-Speech System
  category: utilities
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Index-TTS/icon.svg
  homepage: https://github.com/index-tts/index-tts
  web_port: WEB_PORT
  web_path: /
  platforms:
  - linux/amd64
  notes: '1. Please ensure available memory > 12 GB, otherwise the application may not run properly

    2. The application takes approximately 5 minutes to start, please be patient

    3. This application runs on CPU by default. This mode has low computational efficiency and will cause
    extremely high resource consumption and potential system instability. For optimal performance and
    stability, it is strongly recommended to use NVIDIA GPU to run this application

    4. If you need to use NVIDIA GPU, please select "Custom Install" and enable the GPU option (supported
    in ZimaOS 1.5.0 and above)'
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '17869'
services:
  index-tts:
    image: icewhaletech/index-tts:2.0
    container_name: index-tts
    restart: unless-stopped
    ports:
    - target: 7860
      published: ${WEB_PORT}
      protocol: tcp
    deploy:
      resources:
        reservations:
          memory: 12G
