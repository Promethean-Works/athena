x-athena:
  title: Emby
  description: Media server for streaming movies, shows, music, and live TV to any device.
  tagline: Media server for your personal library.
  tags: [Media, Streaming, Movies, TV]
  license: "GPL-2.0"
  category: media
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Emby/icon.svg
  homepage: https://emby.media
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Emby/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Emby/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8185"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  emby:
    image: emby/embyserver:4.11.0.13
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8096/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/media:/media:ro
